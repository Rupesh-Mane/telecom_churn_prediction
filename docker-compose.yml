services:

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi

    container_name: telecom_fastapi

    ports:
      - "8000:8000"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    container_name: telecom_streamlit

    ports:
      - "8501:8501"

    depends_on:
      - fastapi